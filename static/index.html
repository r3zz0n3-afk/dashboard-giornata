<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191919" media="(prefers-color-scheme: dark)">
<title>La mia giornata</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Il font arriva da Google: con media="print" il browser non lo aspetta per disegnare la pagina,
     poi onload lo attiva. Intanto si vede il font di sistema (su iPhone San Francisco). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      media="print" onload="this.media='all'">
<!-- Il colore di fondo è qui dentro, così è giusto fin dal primo istante, anche prima che arrivi style.css. -->
<style>html{background:#fff}@media (prefers-color-scheme:dark){html{background:#191919}}</style>
<link rel="stylesheet" href="css/style.css">
<link rel="apple-touch-icon" href="img/icon.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="img/icon.png">
<script src="js/script.js" defer></script>
</head>
<body class="loading">
<!-- Schermata d'apertura: copre la pagina finché non arrivano i dati, poi script.js la fa sparire. -->
<div class="splash" id="splash" role="status">
  <div class="cal" aria-hidden="true"><span class="cal-month" id="splashMonth"></span><span class="cal-day num" id="splashDay"></span></div>
  <div class="splash-text">Caricamento<span class="dots" aria-hidden="true"><span>.</span><span>.</span><span>.</span></span></div>
</div>
<main class="page" aria-busy="true">
  <header class="title-row">
    <div>
      <h1 id="date"></h1>
      <p class="summary" id="summary"></p>
    </div>
    <div class="now-side">
      <div class="clock num" id="clock"></div>
      <div class="weather" id="weather"></div>
    </div>
  </header>

  <!-- Una linguetta per ogni giorno della settimana: tocca, scorri col dito o usa le frecce ← → -->
  <nav class="week" id="week" aria-label="Scegli il giorno"></nav>

  <div id="alerts"></div>

  <div id="dayView">
    <section class="day" aria-label="Adesso e la giornata">
      <div class="callout" id="nowCard"></div>
      <div class="strip" id="strip" aria-hidden="true"></div>
    </section>

    <div class="cols">
      <section class="block">
        <h2><span id="dayLabel">Oggi</span> <span class="count num" id="countDay"></span><span class="h2-side" id="dayWeather"></span></h2>
        <div id="allDay" class="tags"></div>
        <div id="dayList"></div>
      </section>
      <aside class="side">
        <section class="block">
          <h2>Promemoria <span class="count" id="countRem"></span></h2>
          <div id="reminders"></div>
        </section>
      </aside>
    </div>
  </div>

  <footer>
    <span id="updated"></span>
    <button id="refresh" type="button">Aggiorna</button>
  </footer>
</main>
</body>
</html>
