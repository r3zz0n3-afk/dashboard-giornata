<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0c0c" media="(prefers-color-scheme: dark)">
<title>La mia giornata</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- I font arrivano da Google (Inter per il testo, Geist Mono per le etichette): con media="print" il browser
     non li aspetta per disegnare la pagina, poi onload li attiva. Intanto si vede il font di sistema. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Inter:wght@300;400;500;600;700&display=swap"
      media="print" onload="this.media='all'">
<!-- Il colore di fondo è qui dentro, così è giusto fin dal primo istante, anche prima che arrivi style.css. -->
<style>html{background:#fff}@media (prefers-color-scheme:dark){html{background:#0c0c0c}}</style>
<link rel="stylesheet" href="css/style.css">
<link rel="apple-touch-icon" href="img/icon.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="img/icon.png">
<script src="js/script.js" defer></script>
</head>
<body class="loading bg-ground text-ink font-sans text-[15px]/[1.47] tracking-[-.01em] antialiased">
<!-- Schermata d'apertura: copre la pagina finché non arrivano i dati, poi script.js toglie "loading" dal body
     e in-[.loading]: smette di valere, quindi la schermata svanisce. -->
<div id="splash" role="status" class="fixed inset-0 z-10 flex flex-col items-center justify-center gap-5 bg-ground
  invisible opacity-0 in-[.loading]:visible in-[.loading]:opacity-100 transition-[opacity,visibility] duration-300 ease-out">
  <div aria-hidden="true" class="card flex h-[82px] w-[76px] flex-col overflow-hidden animate-breathe">
    <span id="splashMonth" class="bg-today text-center text-xs/[22px] font-semibold text-white"></span>
    <span id="splashDay" class="grid flex-1 place-items-center text-[34px] font-light tracking-[-.02em] tabular-nums"></span>
  </div>
  <div class="text-muted">Caricamento<span aria-hidden="true" class="*:opacity-0 *:animate-dot [&>:nth-child(2)]:[animation-delay:.2s] [&>:nth-child(3)]:[animation-delay:.4s]"><span>.</span><span>.</span><span>.</span></span></div>
</div>
<main aria-busy="true" class="mx-auto max-w-[1100px] px-4 pt-6 pb-28 md:px-8 md:pt-8 md:pb-10">
  <!-- Da computer: due pillole per scegliere la schermata, quella aperta è nera (sul telefono la barra è in basso) -->
  <nav aria-label="Schermate" class="mb-8 hidden md:flex">
    <div class="inline-flex gap-1 rounded-full border border-rule p-1">
      <a href="#/" data-view="home" class="block h-8 rounded-full px-4 text-sm/8 font-medium text-muted transition-colors hover:bg-active hover:text-ink aria-[current=page]:bg-ink aria-[current=page]:text-surface">Home</a>
      <a href="#/calendario" data-view="cal" class="block h-8 rounded-full px-4 text-sm/8 font-medium text-muted transition-colors hover:bg-active hover:text-ink aria-[current=page]:bg-ink aria-[current=page]:text-surface">Calendario</a>
    </div>
  </nav>

  <!-- titolo: la data a sinistra e l'ora a destra, grandi e sottili come i titoli di Figma -->
  <header class="flex items-start justify-between gap-4">
    <div>
      <h1 id="date" class="text-[24px]/[1.1] font-light tracking-[-.03em] md:text-[44px]"></h1>
      <p id="summary" class="mt-2 text-muted [body:not(.loading)_&]:animate-appear"></p>
    </div>
    <div class="shrink-0 text-right">
      <div id="clock" class="text-[24px]/[1.1] font-light tracking-[-.03em] tabular-nums md:text-[44px]"></div>
      <div id="weather" class="mt-2 text-sm md:text-[15px] [body:not(.loading)_&]:animate-appear"></div>
    </div>
  </header>

  <div id="alerts"></div>

  <!-- HOME: la dashboard principale. Oggi, i promemoria e, nei prossimi passi, esami, Spotify e notifiche. -->
  <div id="viewHome" class="[body:not(.loading)_&]:animate-appear">
    <section aria-label="Adesso" class="note mt-6 bg-lime p-4 md:mt-8 md:p-6">
      <div id="hNow" class="mb-5 grid gap-1"></div>
      <div id="hStrip" class="relative"></div>
    </section>

    <!-- Esami: il conto alla rovescia, dal calendario indicato in EXAMS nel file .env. Sul telefono le schede scorrono di lato. -->
    <section id="exams" hidden class="mt-7 md:mt-8">
      <h2 class="mb-3 flex items-baseline gap-2 px-1 font-mono text-xs font-medium tracking-[.08em] text-muted uppercase md:text-[13px]">Esami <span id="examCount" class="text-ink tabular-nums"></span></h2>
      <div id="examList" class="-mx-4 flex snap-x snap-mandatory scroll-px-4 gap-3 overflow-x-auto px-4 [scrollbar-width:none] md:mx-0 md:grid md:grid-cols-4 md:overflow-visible md:px-0"></div>
    </section>

    <!-- Spotify: cosa stai ascoltando e i comandi. Compare solo se Spotify è configurato nel file .env; lo riempie script.js -->
    <section id="music" hidden aria-label="Musica" class="note mt-7 bg-rose p-4 md:mt-8 md:p-5"></section>

    <div class="mt-7 grid items-start gap-6 md:mt-8 md:grid-cols-[minmax(0,3fr)_minmax(0,2fr)]">
      <section>
        <h2 class="mb-3 flex items-baseline gap-2 px-1 font-mono text-xs font-medium tracking-[.08em] text-muted uppercase md:text-[13px]">Oggi <span id="hCount" class="text-ink tabular-nums"></span><span id="hWeather" class="ml-auto font-sans text-[13px] tracking-normal text-muted normal-case"></span></h2>
        <div class="card px-4 py-1 md:px-5">
          <div id="hAllDay" class="flex flex-wrap gap-1.5 pt-3.5 pb-1 empty:hidden"></div>
          <div id="hList"></div>
        </div>
      </section>
      <section>
        <h2 class="mb-3 flex items-baseline gap-2 px-1 font-mono text-xs font-medium tracking-[.08em] text-muted uppercase md:text-[13px]">Promemoria <span id="countRem" class="text-ink tabular-nums"></span></h2>
        <div class="card px-4 py-1 md:px-5">
          <div id="reminders"></div>
          <!-- Aggiungere un promemoria: resta fuori da #reminders, così il ridisegno ogni 15 secondi non cancella quello che scrivi -->
          <div class="border-t border-rule">
            <button id="addOpen" type="button" class="flex w-full cursor-pointer items-center gap-3 py-3 text-left text-muted hover:text-ink">
              <span aria-hidden="true" class="grid size-5 place-items-center text-xl/none">+</span>Nuovo promemoria
            </button>
            <form id="addForm" hidden class="py-3">
              <input id="addTitle" name="title" required maxlength="200" autocomplete="off" placeholder="Cosa devi fare?" aria-label="Promemoria"
                class="w-full rounded-lg border border-rule bg-transparent px-3 py-2.5 text-base outline-none placeholder:text-muted focus:border-ink">
              <div class="mt-2 flex flex-wrap items-center gap-2">
                <input id="addDate" name="date" type="date" aria-label="Giorno (facoltativo)"
                  class="h-10 rounded-lg border border-rule bg-transparent px-2.5 text-sm text-ink outline-none focus:border-ink">
                <input id="addTime" name="time" type="time" aria-label="Ora (facoltativa)"
                  class="h-10 rounded-lg border border-rule bg-transparent px-2.5 text-sm text-ink outline-none focus:border-ink">
                <span class="ml-auto flex gap-2">
                  <button id="addCancel" type="button" class="h-10 cursor-pointer rounded-full px-4 text-sm font-medium text-muted hover:bg-active hover:text-ink">Annulla</button>
                  <button type="submit" class="h-10 cursor-pointer rounded-full bg-ink px-5 text-sm font-medium text-surface transition hover:opacity-85 active:scale-96 disabled:opacity-50">Aggiungi</button>
                </span>
              </div>
            </form>
          </div>
        </div>
      </section>
    </div>
  </div>

  <!-- CALENDARIO: la settimana un giorno alla volta. Tocca le linguette, scorri col dito o usa le frecce ← → -->
  <div id="viewCal" hidden class="[body:not(.loading)_&]:animate-appear">
    <nav id="week" aria-label="Scegli il giorno" class="mt-5 grid grid-cols-7 md:mt-7 md:gap-1"></nav>

    <div id="calBody">
      <section id="cDay" aria-label="La giornata" class="note mt-5 bg-lilac p-4 md:p-6">
        <div id="cStrip" class="relative"></div>
      </section>

      <div class="mt-7 grid items-start gap-6 md:mt-8 md:grid-cols-[minmax(0,3fr)_minmax(0,2fr)]">
        <section>
          <h2 class="mb-3 flex items-baseline gap-2 px-1 font-mono text-xs font-medium tracking-[.08em] text-muted uppercase md:text-[13px]"><span id="cLabel">Oggi</span> <span id="cCount" class="text-ink tabular-nums"></span><span id="cWeather" class="ml-auto font-sans text-[13px] tracking-normal text-muted normal-case"></span></h2>
          <div class="card px-4 py-1 md:px-5">
            <div id="cAllDay" class="flex flex-wrap gap-1.5 pt-3.5 pb-1 empty:hidden"></div>
            <div id="cList"></div>
          </div>
        </section>
        <section>
          <h2 class="mb-3 flex items-baseline gap-2 px-1 font-mono text-xs font-medium tracking-[.08em] text-muted uppercase md:text-[13px]">La settimana</h2>
          <div id="weekList" class="card px-4 py-1 md:px-5"></div>
        </section>
      </div>
    </div>
  </div>

  <footer class="mt-10 flex flex-wrap items-center justify-between gap-3 px-1 text-[13px] text-muted">
    <span id="updated"></span>
    <!-- notifiche: il pulsante (o il motivo per cui non si possono attivare) lo scrive script.js -->
    <div id="push" class="flex flex-wrap items-center gap-2 empty:hidden md:ml-auto"></div>
    <!-- pulsante a pillola nera, come quelli di Figma: si "schiaccia" quando lo premi -->
    <button id="refresh" type="button" class="h-11 cursor-pointer rounded-full bg-ink px-5 text-sm font-medium text-surface
      transition hover:opacity-85 active:scale-96 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent md:h-8">Aggiorna</button>
  </footer>
</main>

<!-- Sul telefono: la barra in basso, con lo spazio per la barra di sistema dell'iPhone (safe-area). -->
<nav aria-label="Schermate" class="fixed inset-x-0 bottom-0 z-[5] flex border-t border-rule bg-surface pb-[env(safe-area-inset-bottom)] md:hidden">
  <a href="#/" data-view="home" class="flex flex-1 flex-col items-center gap-0.5 pt-2 pb-1.5 text-[11px] font-semibold text-muted aria-[current=page]:text-ink">
    <svg viewBox="0 0 24 24" aria-hidden="true" class="size-6 fill-none stroke-current stroke-[1.6] [stroke-linecap:round] [stroke-linejoin:round]"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg>
    Home
  </a>
  <a href="#/calendario" data-view="cal" class="flex flex-1 flex-col items-center gap-0.5 pt-2 pb-1.5 text-[11px] font-semibold text-muted aria-[current=page]:text-ink">
    <svg viewBox="0 0 24 24" aria-hidden="true" class="size-6 fill-none stroke-current stroke-[1.6] [stroke-linecap:round] [stroke-linejoin:round]"><rect x="4" y="5.5" width="16" height="14.5" rx="2.5"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/></svg>
    Calendario
  </a>
</nav>
</body>
</html>
