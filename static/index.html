<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191919" media="(prefers-color-scheme: dark)">
<title>La mia giornata</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Il font arriva da Google: con media="print" il browser non lo aspetta per disegnare la pagina,
     poi onload lo attiva. Intanto si vede il font di sistema (su iPhone San Francisco). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      media="print" onload="this.media='all'">
<!-- Il colore di fondo è qui dentro, così è giusto fin dal primo istante, anche prima che arrivi style.css. -->
<style>html{background:#fff}@media (prefers-color-scheme:dark){html{background:#191919}}</style>
<link rel="stylesheet" href="css/style.css">
<link rel="apple-touch-icon" href="img/icon.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="img/icon.png">
<script src="js/script.js" defer></script>
</head>
<body class="loading">
<!-- Le barre grigie (.sk) sono segnaposto: restano finché non arrivano i dati, poi script.js le sostituisce. -->
<main class="page" aria-busy="true">
  <header class="title-row">
    <div>
      <h1 id="date"></h1>
      <p class="summary" id="summary"><span class="sk" style="width:280px"></span></p>
    </div>
    <div class="now-side">
      <div class="clock num" id="clock"></div>
      <div class="weather" id="weather"><span class="sk" style="width:110px;margin-left:auto"></span></div>
    </div>
  </header>

  <div id="alerts"></div>

  <section class="day" aria-label="Adesso e la giornata">
    <div class="callout" id="nowCard">
      <span class="sk sk-lg" style="width:45%"></span>
      <span class="sk" style="width:30%"></span>
    </div>
    <div class="strip" id="strip" aria-hidden="true"></div>
  </section>

  <div class="cols">
    <section class="block">
      <h2>Oggi <span class="count num" id="countToday"></span></h2>
      <div id="allDay" class="tags"></div>
      <div id="today">
        <div class="row"><span class="sk"></span><span class="sk" style="width:60%"></span></div>
        <div class="row"><span class="sk"></span><span class="sk" style="width:45%"></span></div>
        <div class="row"><span class="sk"></span><span class="sk" style="width:70%"></span></div>
      </div>
    </section>
    <div class="side">
      <section class="block">
        <h2>Promemoria <span class="count" id="countRem"></span></h2>
        <div id="reminders">
          <div class="todo"><span class="sk"></span><span class="sk" style="width:65%"></span></div>
          <div class="todo"><span class="sk"></span><span class="sk" style="width:50%"></span></div>
        </div>
      </section>
      <section class="block">
        <h2>Domani <span class="count num" id="countTom"></span><span class="h2-side" id="tomWeather"></span></h2>
        <div id="tomorrow">
          <div class="row"><span class="sk"></span><span class="sk" style="width:55%"></span></div>
        </div>
      </section>
    </div>
  </div>

  <footer>
    <span id="updated"></span>
    <button id="refresh" type="button">Aggiorna</button>
  </footer>
</main>
</body>
</html>
